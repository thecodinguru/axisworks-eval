[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "axisworks-eval"
version = "2026.10.18"
description = "Checks for the AxisWorks accuracy report, published for verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=10", "pdfplumber==0.11.9", "ezdxf>=1.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["axisworks_eval"]
